[package]
name = "aish-webhook-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "aish webhook broker client: broker connection manager, background message loop, and plugin handler dispatch (SPR-059 Phase 4.8/4.9/5 client integration)."
repository = "https://github.com/LightHeart-Ventures/aish"
publish = false

[features]
# `net` pulls the real WebSocket transport (tokio-tungstenite). The core
# connection-manager / dispatcher logic and all tests are hermetic and build
# with `--no-default-features` against the in-crate MockTransport.
default = ["net"]
net = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
tokio-tungstenite = { version = "0.23", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util", "test-util"] }
