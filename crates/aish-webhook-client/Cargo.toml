[package]
name = "aish-webhook-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "aish webhook broker client: broker connection manager, background message loop, and plugin handler dispatch (SPR-059 Phase 4.8/4.9/5 client integration)."
repository = "https://github.com/LightHeart-Ventures/aish"
publish = false

[features]
# `net` pulls the real WebSocket transport (tokio-tungstenite). The core
# connection-manager / dispatcher logic and all tests are hermetic and build
# with `--no-default-features` against the in-crate MockTransport.
default = ["net"]
# It also pulls reqwest for `POST /clients/register` (TASK-449: the broker only
# accepts a session_token issued there) and rustls so `wss://` brokers (Fly)
# are dialable. reqwest/rustls/ring/webpki-roots are already in aish's tree.
net = ["dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest", "dep:rustls"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
libc = "0.2"
tokio-tungstenite = { version = "0.23", optional = true, features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls"] }
# Only used to install a process-default CryptoProvider: aish's build enables
# both `ring` and `aws-lc-rs` on rustls, so tokio-tungstenite's
# `ClientConfig::builder()` would otherwise panic on the first wss:// dial.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs", "test-util"] }
