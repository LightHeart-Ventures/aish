name: Voice feature build

# SPR-068 / FR-334 (TASK-362..367): compile the optional `voice` feature so the
# audio + Whisper stack (cpal / rubato / whisper-rs / crossterm) can't silently
# rot outside the default `--no-default-features` CI gate.
#
# GATING: TASK-367 (REPL wiring) is the final implementation task; the voice
# feature is now expected to compile clean, so continue-on-error is set to false.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/voice.rs'
      - 'src/voice/**'
      - 'src/repl.rs'
      - '.github/workflows/voice-feature-build.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/voice.rs'
      - 'src/voice/**'
      - 'src/repl.rs'
      - '.github/workflows/voice-feature-build.yml'
  workflow_dispatch:

concurrency:
  group: voice-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-build:
    name: cargo build --features voice
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Gating as of TASK-367 — voice feature pipeline is complete.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Install native voice prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake clang libclang-dev build-essential

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-voice-${{ hashFiles('**/Cargo.lock') }}

      - name: Build voice feature
        run: cargo build --features voice --locked
