name: Release

# Triggered by pushing a semver tag (v0.4.0, v0.4.1, …). Builds release binaries
# for every supported target, generates a SHA256 checksum next to each, and
# publishes a GitHub Release with all artifacts attached. The `:update` command
# (src/update.rs) consumes exactly these assets: it matches the per-platform
# binary name and verifies it against the sibling `.sha256`.
#
# Platform support: aish is a Unix-native shell. It depends on process groups
# (setpgid/tcsetpgrp), SIGCHLD reaping, terminal control, and POSIX-only APIs
# (pre_exec, ExitStatusExt::signal, PermissionsExt::set_mode) for its job-control
# and tty-handoff layers — none of which exist on Windows. The release therefore
# targets macOS (x86_64 + arm64) and Linux (x86_64) only; a Windows MSVC build
# cannot compile and was removed (it blocked the whole release via `needs:
# build`). Windows users run aish under WSL.
on:
  push:
    tags:
      - "v*"

# Need write access to create the release + upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail the release fast (before any expensive cross-target builds) if the
  # pushed tag does not match the version baked into Cargo.toml. The runtime
  # version string comes from env!("CARGO_PKG_VERSION") (see src/update.rs
  # current_version()), so a tag/Cargo.toml drift ships a binary that reports
  # the wrong version — which makes `:update` compare the new tag against the
  # stale baked version forever and re-download on every startup. Guarding here
  # makes that drift impossible to release.
  verify-version:
    name: verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert tag == Cargo.toml package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag version:        $tag"
          echo "Cargo.toml version: $cargo_version"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Release tag v$tag does not match Cargo.toml version $cargo_version. Bump Cargo.toml (and Cargo.lock) before tagging so the binary reports the right version."
            exit 1
          fi
        shell: bash

      # Fail FAST (before the multi-minute cross-target builds) if a *published*
      # GitHub Release already exists for this tag. GitHub immutable releases
      # freeze a release the moment it is published: its metadata can't be
      # updated AND no assets can be attached afterwards (HTTP 422 "Cannot upload
      # assets to an immutable release"). So if someone pre-publishes a bare
      # release out-of-band (e.g. `gh release create v$tag --notes ...` from a
      # local release script), the `publish release` job below cannot attach the
      # per-platform binaries that `:update` (src/update.rs) depends on — it dies
      # 4 minutes in with the cryptic "target_commitish cannot be changed when
      # release is immutable". This guard turns that into an instant, actionable
      # failure. A pre-existing *draft* is fine: drafts stay mutable, so the
      # softprops step uploads assets and publishes it. The happy path (no
      # release exists yet) passes straight through — the workflow creates and
      # publishes the release itself, with assets, in one shot.
      - name: Assert no published release already exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null || true)"
          if [ -z "$json" ]; then
            echo "No existing release for $tag — this workflow will create and publish it. OK."
            exit 0
          fi
          is_draft="$(echo "$json" | jq -r '.isDraft')"
          if [ "$is_draft" = "true" ]; then
            echo "A DRAFT release exists for $tag — drafts are mutable, so the publish job will upload assets and publish it. OK."
            exit 0
          fi
          echo "::error::A PUBLISHED release already exists for $tag. GitHub immutable releases cannot receive assets after publishing, so this workflow cannot attach the binaries that ':update' needs — it would fail with 'target_commitish cannot be changed when release is immutable'. Do NOT pre-publish the release: let this workflow create it, or pre-create it as a DRAFT. To recover this tag: delete the release AND the tag, then re-push the tag so this workflow recreates it with assets (or bump the version)."
          exit 1
        shell: bash

  build:
    name: build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: aish-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aish-aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: aish-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --no-default-features drops the in-process local model (mistralrs), which
      # is huge, slow to build, and not needed for the distributed binary. The
      # released aish is the fast Claude/Grok build; users who want local
      # inference build from source with `--features local`.
      - name: Build release binary
        run: cargo build --release --no-default-features --target ${{ matrix.target }}
        shell: bash

      # Stage the binary under its per-platform asset name and emit a SHA256
      # sidecar (`<asset>.sha256`). The checksum file is the bare hex digest plus
      # the filename — the format `shasum -c` / `sha256sum -c` expect, and what
      # src/update.rs parses (first whitespace-delimited token = hex digest).
      - name: Package binary + checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/aish" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # download-artifact nests each artifact under its own directory; flatten
      # them into one dir so every binary + checksum is a release asset.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'aish-*' \) -exec cp {} dist/ \;
          echo "Release assets:"
          ls -l dist
          echo
          echo "Aggregated checksums:"
          cat dist/*.sha256

      # A single SHA256SUMS roll-up alongside the per-file sidecars — convenient
      # for `sha256sum -c SHA256SUMS` and for humans eyeballing the release.
      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: aish ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/aish-*
            dist/SHA256SUMS
