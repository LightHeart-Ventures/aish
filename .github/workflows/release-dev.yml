name: Release (Dev)

# Nightly dev builds: latest development snapshot, pre-release. Triggered on schedule (nightly) or manually.
# Tags: dev-v{next-semver}-dev.{run_number} (e.g., dev-v0.24.0-dev.123)
# Marked as prerelease so :update with AISH_UPDATE_CHANNEL=dev pulls the latest dev, not prod.
on:
  schedule:
    # 04:00 UTC daily — low-traffic window to avoid runner contention
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dev-nightly
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }} (dev)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: aish-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aish-aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: aish-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve next semantic version
        id: nextver
        run: |
          set -euo pipefail
          current="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          # Parse current as MAJOR.MINOR.PATCH and bump MINOR for the next dev cycle
          IFS='.' read -r major minor patch <<< "$current"
          next_minor=$((minor + 1))
          next_version="${major}.${next_minor}.0"
          echo "current_version=$current"
          echo "next_version=$next_version"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --features local --target ${{ matrix.target }}
        shell: bash

      - name: Package binary + checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/aish" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-dev
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish dev release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve next semantic version
        id: nextver
        run: |
          set -euo pipefail
          current="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          IFS='.' read -r major minor patch <<< "$current"
          next_minor=$((minor + 1))
          next_version="${major}.${next_minor}.0"
          tag="dev-v${next_version}-dev.${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'aish-*' ! -name '*-dev' \) -exec cp {} dist/ \;
          echo "Dev release assets:"
          ls -l dist

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS 2>/dev/null || echo "(no checksums)"

      - name: Create and publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.nextver.outputs.tag }}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "aish $tag (dev)" \
            --notes "Development build from $(git rev-parse --short "$GITHUB_SHA"). Unstable — for testing only." \
            dist/aish-* dist/SHA256SUMS
        shell: bash

      # Fail loudly if the published release is asset-less. `gh release create`
      # uploads assets atomically before publish (unlike softprops' create-then-
      # upload, which 422s on this immutable-release repo — see run 28553643115),
      # but masking publish errors with `|| true` previously let zero-asset
      # releases ship green and silently break `:update --channel dev`. Assert the
      # 7 expected assets (3 binaries + 3 .sha256 + SHA256SUMS) exist.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.nextver.outputs.tag }}"
          count="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          echo "Published $tag with $count assets."
          if [ "$count" -lt 7 ]; then
            echo "::error::Dev release $tag published with $count assets (expected 7). ':update --channel dev' would break. Failing so this surfaces instead of shipping silently."
            exit 1
          fi
        shell: bash

  prune:
    name: prune old dev releases
    needs: release
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Prune releases older than 5 latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # List all dev releases, sorted by creation date (newest first)
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json tagName,createdAt --jq '.[] | select(.tagName | startswith("dev-"))' \
            | tail -n +6 | jq -r '.tagName' | while read -r tag; do
            echo "Deleting old dev release: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
          done
        shell: bash
