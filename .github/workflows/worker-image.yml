name: Worker Image

# Builds and publishes the background-worker container image (Dockerfile.worker)
# to the GitHub Container Registry. A "worker" is `aish` re-exec'd in
# --coordinator mode inside this image (see src/container.rs).
#
# ─── Dockerfile.worker is a MULTI-STAGE SELF-BUILD — do NOT reintroduce a host
#     pre-compile here ──────────────────────────────────────────────────────
# Dockerfile.worker compiles `aish` INSIDE a `rust:1-bookworm` builder stage and
# copies the resulting binary into the matching `debian:bookworm-slim` runtime,
# so the container's glibc ALWAYS matches the binary regardless of the runner's
# host distro. Do NOT add back a runner-side `cargo build` + `COPY` of
# `target/release/aish` (an `AISH_BIN` build-arg) — that was the EXACT cause of
# the glibc-mismatch failure class: a binary built on a modern host (Ubuntu 24.04
# → glibc 2.39) produced an image that BUILT and INSPECTED fine, then died at
# container exec with `/lib/x86_64-linux-gnu/libc.so.6: version 'GLIBC_2.39' not
# found`, surfacing to operators only as opaque failed background jobs.
#
# Because the compile happens inside Docker, this workflow needs NO Rust
# toolchain, NO cargo cache, and NO build-args on the runner — it just hands the
# source tree (build context) to buildx. `.dockerignore` trims target/, .git, and
# worktrees so no host-libc binary can leak into the context.
#
# This is the CI counterpart of the Makefile's `worker-image-multiarch` target.
# It runs on Blacksmith's cache-backed Docker builder actions:
#   - useblacksmith/setup-docker-builder@v1  (buildx builder w/ sticky cache)
#   - useblacksmith/build-push-action@v2     (build + push, native layer cache —
#     the in-image cargo build is cached across runs, so no host cargo cache is
#     needed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR (unchecked = build only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository }}/aish-worker

jobs:
  worker-image:
    name: build & push worker image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      # Blacksmith's drop-in for docker/setup-buildx-action: provisions a buildx
      # builder backed by Blacksmith's sticky layer cache (which also caches the
      # in-image cargo build layers between runs).
      - name: Set up Docker builder (Blacksmith)
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        # Only needed when we actually push (tag pushes, or dispatch with push=true).
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # The multi-stage Dockerfile.worker self-builds the binary against the
      # runtime base's glibc, so we pass only the source context — no build-args,
      # no prebuilt binary. linux/amd64 matches the debian:bookworm-slim base and
      # the amd64 hosts workers run on; the self-build makes adding linux/arm64
      # here trivial (buildx emulates the arch) if that's ever needed.
      - name: Build & push worker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
