name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (Claude-only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Incremental-compilation state is a fine-grained, environment-specific
      # cache that rustc does not guarantee is safe to restore verbatim onto
      # a different checkout/toolchain. This job's cache key
      # (`hashFiles('**/Cargo.lock')`, no rustc version, no restore-keys) plus
      # `cancel-in-progress: true` above means a `target/` dir can be
      # committed to the cache mid-write (job cancelled by a superseding
      # push) and then restored unmodified for a *different*, unrelated PR
      # that happens to share the same lockfile hash. Symptom seen in BP-020:
      # a pure, zero-I/O unit test (pipeline::tests::parse_splits_stages)
      # failing an assertion against content that does not match the
      # checked-out source — consistent with a stale/corrupted incremental
      # unit surviving cache reuse rather than any real test flakiness.
      # Disabling incremental compilation in CI is the standard fix: a CI job
      # builds from scratch every time regardless (no local iterative
      # recompiles to speed up), so incremental buys nothing here and only
      # adds this correctness risk.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      # Blacksmith's own cache store, NOT GitHub's shared Actions-cache quota.
      # useblacksmith/cache is a drop-in fork of actions/cache (identical
      # inputs) that reads/writes Blacksmith-local storage.
      #
      # Why it matters: this repo's GitHub Actions cache was measured at
      # 9.29 GB / 10 GB across 30 entries — ALL of them
      # macOS-{x86_64,aarch64}-apple-darwin release-build caches at ~313 MB
      # each, two freshly written per commit to main. GitHub evicts
      # least-recently-used once the 10 GB repo quota is hit, so every Linux
      # CI cache this job wrote was gone before the next PR could restore it.
      # Observed on run 37568357666: restore step 0s (MISS), Test 6m07s
      # (cold full rebuild), post-save 4s. Moving the Blacksmith-hosted jobs
      # onto Blacksmith's store takes them off that quota entirely, so Linux
      # caches survive AND the macOS release legs stop starving them.
      - name: Cache cargo + target
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --no-default-features drops the in-process local model (mistralrs /
      # mistralrs-core), which is huge and unneeded for the oracle harness +
      # unit tests. The oracle cases (src/oracle.rs) diff aish's native
      # pipeline/direct-dispatch path against real bash; bash ships on the
      # runner. Test builds must NOT pull in mistralrs-core unless a job
      # explicitly opts back in with `--features local`.
      - name: Probe runner environment
        run: |
          rustc --version && cargo --version
          rustup show || true
          echo "CPU cores:" && nproc
          echo "Memory:" && free -h
          echo "Disk:" && df -h
          echo "Env (relevant):" && env | grep -E "CARGO|RUST" | sort || true

      # No `-j 1` here (nor on the three cargo invocations below). The jobs cap
      # lives in the committed .cargo/config.toml (`jobs = 6`), and that cap
      # exists for ONE reason: the `local` feature's llama.cpp bindings
      # (llama-cpp-sys-2) compiled at opt-level=3, where a single rustc peaks
      # past 1.5 GB and `nproc`-wide codegen OOM-kills the build. None of this
      # job's cargo invocations can reach that crate: the three aish-workspace
      # ones all pass --no-default-features, and aish-webhook-broker is a
      # separate workspace that never depends on it. So `-j 1` was serializing
      # codegen on a 4-vCPU runner to dodge a hazard absent from this build
      # graph, at ~4 min/PR. `-j` is build parallelism only — test-thread
      # behaviour is unchanged. Let the committed config govern.
      - name: Test
        run: |
          set -o pipefail
          cargo test --no-default-features --locked --verbose -- --nocapture 2>&1 | tee test-output.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

      # SPR-059 webhook broker client (TASK-264/265/268). Hermetic tests build
      # with --no-default-features against the in-crate MockTransport (drops the
      # tokio-tungstenite `net` transport). Gated explicitly so the crate can't
      # silently rot outside the root package's test surface.
      - name: Test webhook client (SPR-059)
        run: cargo test -p aish-webhook-client --no-default-features --locked -- --nocapture

      # The root Cargo.toml is a *mixed* manifest (both `[workspace]` and
      # `[package]`), so a bare `cargo test` above only tests the `aish`
      # package itself — it silently skips every other workspace member
      # unless named explicitly with `-p`. git-discover's own unit tests
      # (crates/git-discover/src/lib.rs `#[cfg(test)] mod tests`) were never
      # run by CI as a result; only `tests/git_discover_linkage.rs` (a
      # compile-linkage smoke test in the root package) touched the crate at
      # all. Run it directly so its real coverage isn't silently skipped.
      - name: Test git-discover
        run: cargo test -p git-discover --no-default-features --locked -- --nocapture

      # webhook-receiver (SPR-059) is a workspace member but is deliberately
      # NOT added here yet: its `sqlx` dependency currently pulls in the
      # `runtime-tokio-native-tls` feature, which needs a system OpenSSL dev
      # package this runner doesn't have (see BP-023/BP-024 in the brainpower
      # backlog). A pending fix (PR #806) rewrites its test module against
      # the crate's real API AND switches sqlx to `runtime-tokio-rustls`,
      # which removes that native dependency. Add
      # `cargo test -p webhook-receiver --no-default-features --locked`
      # here once #806 (or its equivalent) has merged to main.

      # aish-webhook-broker (SPR-059, TASK-257) is intentionally a *separate*
      # Cargo workspace (its own `[workspace]` table + Cargo.lock — see the
      # comment at the top of crates/aish-webhook-broker/Cargo.toml) so its
      # build graph never picks up aish's heavy `local`-feature deps. That
      # decoupling means it is invisible to every `-p <name>` flag above,
      # which resolves against the root workspace's member list — it has
      # never been built or tested in CI at all. Point cargo at its manifest
      # directly.
      - name: Test webhook broker
        run: cargo test --manifest-path crates/aish-webhook-broker/Cargo.toml --locked -- --nocapture
