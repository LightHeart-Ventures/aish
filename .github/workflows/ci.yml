name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (Claude-only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --no-default-features drops the in-process local model (mistralrs /
      # mistralrs-core), which is huge and unneeded for the oracle harness +
      # unit tests. The oracle cases (src/oracle.rs) diff aish's native
      # pipeline/direct-dispatch path against real bash; bash ships on the
      # runner. Test builds must NOT pull in mistralrs-core unless a job
      # explicitly opts back in with `--features local`.
      - name: Probe runner environment
        run: |
          rustc --version && cargo --version
          rustup show || true
          echo "CPU cores:" && nproc
          echo "Memory:" && free -h
          echo "Disk:" && df -h
          echo "Env (relevant):" && env | grep -E "CARGO|RUST" | sort || true

      - name: Test
        run: |
          set -o pipefail
          cargo test --no-default-features --locked --verbose -j 1 -- --nocapture 2>&1 | tee test-output.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

      # SPR-059 webhook broker client (TASK-264/265/268). Hermetic tests build
      # with --no-default-features against the in-crate MockTransport (drops the
      # tokio-tungstenite `net` transport). Gated explicitly so the crate can't
      # silently rot outside the root package's test surface.
      - name: Test webhook client (SPR-059)
        run: cargo test -p aish-webhook-client --no-default-features --locked -j 1 -- --nocapture
