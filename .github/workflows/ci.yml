name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (Claude-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --no-default-features drops the in-process local model (mistralrs /
      # mistralrs-core), which is huge and unneeded for the oracle harness +
      # unit tests. The oracle cases (src/oracle.rs) diff aish's native
      # pipeline/direct-dispatch path against real bash; bash ships on the
      # runner. Test builds must NOT pull in mistralrs-core unless a job
      # explicitly opts back in with `--features local`.
      - name: Test
        run: cargo test --no-default-features --locked
