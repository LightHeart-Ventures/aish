name: REPL smoke (agent-tty)

# End-to-end smoke that drives the real aish TUI REPL through coder/agent-tty
# and asserts on rendered terminal state. Hermetic: only built-in `:commands`
# are exercised, so NO model call is made. A DUMMY ANTHROPIC_API_KEY is still
# required though: aish resolves a backend credential at BOOT (main.rs builds
# the default `claude` backend via Credential::resolve before the REPL starts),
# so with no credential on the runner aish exits 1 before rendering a prompt.
# The key is never sent anywhere — the smoke fires no turn — it only satisfies
# the boot-time presence check.
#
# Kept as a SEPARATE workflow from ci.yml (cargo test) because it needs Node +
# npx (agent-tty) on top of the Rust toolchain. Runs on PRs that touch the REPL
# surface or the harness, and on demand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/repl.rs'
      - 'src/main.rs'
      - 'tests/repl/**'
      - '.github/workflows/repl-smoke.yml'

concurrency:
  group: repl-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: aish REPL smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      AGENT_TTY_VERSION: '0.5.0'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      # Blacksmith's own cache store — see ci.yml for why this is NOT
      # actions/cache (GitHub's shared 10 GB quota is fully consumed by the
      # macOS release legs, so Linux entries never survived to be restored).
      - name: Cache cargo + target
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `-release-` discriminator is load-bearing: this job builds the
          # RELEASE profile, while ci.yml / ci-testbox.yml build the TEST
          # profile. They previously shared the bare `<os>-cargo-<lock>` key,
          # so whichever job saved first won and the other restored a 262 MB
          # cache of the wrong profile — a guaranteed full rebuild for the
          # loser. Keep one key per cargo profile.
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          # Prefix fallback so a Cargo.lock edit is not a total miss. The bare
          # `<os>-cargo-` tier is a last resort: cross-profile target/ dirs are
          # useless, but ~/.cargo/registry + git are profile-independent and
          # still worth restoring.
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # Claude-only release build (drops the heavy `local` feature) — the smoke
      # never touches local inference. Mirrors `make build-fast`.
      - name: Build aish (fast, Claude-only)
        run: cargo build --release --no-default-features --locked

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Install agent-tty ONCE, globally, so every harness call resolves the same
      # binary and reuses a single warm session-host. Cold-spawning `npx --yes`
      # per call races the session-host bring-up on a fresh runner and surfaces as
      # agent-tty exit 10 ("session host became unreachable"). A warm global bin
      # sidesteps that. The harness auto-prefers an installed `agent-tty`.
      - name: Install agent-tty
        run: |
          npm install -g "agent-tty@${AGENT_TTY_VERSION}"
          agent-tty version

      # jq ships on ubuntu-2404 runners; assert it rather than assume.
      - name: Verify jq
        run: jq --version

      - name: Run REPL smoke
        env:
          AISH_BIN: ${{ github.workspace }}/target/release/aish
          AISH_REPL_STRICT: '1'          # missing prereqs are hard failures here
          AGENT_TTY_VERSION: '0.5.0'
          ARTIFACT_DIR: ${{ github.workspace }}/tests/repl/artifacts
          # Dummy, non-empty key: satisfies aish's boot-time Credential::resolve
          # so the `claude` backend builds and the REPL renders. Never sent — the
          # smoke exercises only built-in `:commands` and fires no model turn.
          ANTHROPIC_API_KEY: 'sk-ant-smoke-dummy-not-a-real-key'
        run: tests/repl/agent_tty_smoke.sh

      - name: Upload REPL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aish-repl-smoke-artifacts
          path: tests/repl/artifacts/*
          if-no-files-found: ignore
          retention-days: 14
