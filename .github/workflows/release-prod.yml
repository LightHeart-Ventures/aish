name: Release (Production)

# Triggered via workflow_dispatch to create a production release with a stable semver tag (v0.4.0, v0.4.1, …).
# This replaces manual tag pushing (which the SRE skill forbids). A maintainer provides the semver version,
# this workflow creates the tag on the current main commit, builds release binaries for every supported target,
# generates SHA256 checksums, and publishes a GitHub Release marked as latest.
#
# Platform support: aish is a Unix-native shell targeting macOS (x86_64 + arm64) and Linux (x86_64) only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g., 0.23.1 — the 'v' prefix is added automatically)"
        required: true
        type: string
      notes:
        description: "Optional release notes (hand-written; auto-generated if empty)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: verify version match
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: origin/main

      - name: Verify Cargo.toml version matches input
        id: version
        run: |
          set -euo pipefail
          input_version="${{ inputs.version }}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          tag="v${input_version}"
          echo "Input version: $input_version"
          echo "Cargo.toml version: $cargo_version"
          if [ "$input_version" != "$cargo_version" ]; then
            echo "::error::Input version $input_version does not match Cargo.toml version $cargo_version. Bump Cargo.toml first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Assert tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Pick a new version."
            exit 1
          fi
        shell: bash

  build:
    name: build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: aish-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aish-aarch64-apple-darwin
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            asset: aish-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: origin/main

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --features local --target ${{ matrix.target }}
        shell: bash

      - name: Package binary + checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/aish" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [verify-version, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'aish-*' \) -exec cp {} dist/ \;
          echo "Release assets:"
          ls -l dist
          echo
          echo "Aggregated checksums:"
          cat dist/*.sha256

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.verify-version.outputs.tag }}"
          notes="${{ inputs.notes }}"
          if [ -z "$notes" ]; then
            # Auto-generate notes from commits since last tag
            notes="$(gh release view --repo "$GITHUB_REPOSITORY" 2>/dev/null | head -20 || echo 'Production release')"
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target origin/main \
            --latest \
            --title "aish $tag" \
            --notes "$notes" \
            dist/aish-* dist/SHA256SUMS
        shell: bash
