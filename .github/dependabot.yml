version: 2
updates:
  # Rust deps. Grouped so a weekly sweep is ONE PR, not 20 — this repo already
  # has branch/worktree sprawl as a tracked problem.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Separate workspace (own Cargo.lock) — invisible to the root manifest above.
  - package-ecosystem: cargo
    directory: "/crates/aish-webhook-broker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      broker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
