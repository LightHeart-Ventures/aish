[advisories]
# The lint level for crates which do not have a detectable license
unlicensed = "deny"
# The lint level used when no other predicates are matched
default = "warn"
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8
# Some crates don't have a detectable license, so we allowlist them here
allow = [
  #{ name = "ansi_term", version = "*" },
]

[licenses]
# The lint level for crates which do not have a detectable license
unlicensed = "deny"
# List of explicitly allowed licenses
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 OR MIT",
  "Apache-2.0 OR MIT OR Zlib",
  "Apache-2.0 OR Apache-2.0 WITH LLVM-exception",
  "Apache-2.0 OR Apache-2.0 WITH LLVM-exception OR MIT",
  "Apache-2.0 OR MIT OR Apache-2.0 WITH LLVM-exception",
  "Apache-2.0 OR Zlib OR MIT",
  "MIT OR Apache-2.0",
  "MIT OR Apache-2.0 OR Zlib",
  "MIT OR Zlib OR Apache-2.0",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
  "NCSA",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "LGPL-2.1-or-later OR Apache-2.0 OR MIT",
]
# Lint level for licenses considered copyleft
copyleft = "warn"
# Blanket approval or denial for OSI-approved or FSF Free/Libre licenses
allow-osi-fsf-free = "both"
# Lint level used when no other predicates are matched
default = "deny"
# The confidence threshold for detecting a license from license text
confidence-threshold = 0.8
# Some crates by default come with both a COPYING and LICENSE file, exfat is an example.
# Both files contain the Apache License (2.0), so they're fine. We just deny instead of
# warn by default for duplicates.
allow-multiple = false

[bans]
# Lint level for when multiple dependency versions are found
multiple-versions = "warn"
# Lint level for when there are wildcard dependencies
wildcards = "warn"
# The graph highlighting used when creating dotgraphs
highlight = "all"
# List of explicitly disallowed duplicate crates
deny = [
  # Each entry the name of a crate and a version range. If multiple versions
  # `major.minor.patch` are found, then it will be denied.
  #{ name = "ansi_term", version = "=0.11.0" },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
  #{ name = "ansi_term", version = "=0.11.0" },
]
# Similarly named crates that are allowed to coexist
skip-tree = [
  #{ name = "windows-sys", version = "=0.36.1" },
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is detected
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not in the allow list is detected
unknown-git = "warn"
# The `default` lint level used for all of the advisory lint levels and the lint level for when the default `cfg` is not matched
default = "deny"
# GitHub Webhooks IP addresses
# https://docs.github.com/webhooks/using-webhooks/validating-webhook-deliveries
allow = [
  # Each entry is the crate index
  # e.g. https://github.com/rust-lang/crates.io-index
  "https://github.com/rust-lang/crates.io-index",
]
allow-org = [
  #{ github = "rust-lang" },
]
