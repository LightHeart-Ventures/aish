[package]
name = "aish"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
# Same version mistralrs pins — used only to prefetch GGUFs with a progress bar.
hf-hub = { version = "0.4.3", optional = true, default-features = false, features = ["tokio", "rustls-tls"] }
libc = "0.2"
mistralrs = { version = "0.8.1", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlite-vec = "0.1.6"
tokio = { version = "1.52.3", features = ["full"] }

[features]
default = ["local"]
# Local in-process inference (mistral.rs). Disable for a fast, Claude-only build:
#   cargo build --no-default-features
local = ["dep:mistralrs", "dep:hf-hub"]
cuda = ["mistralrs/cuda"]

[profile.dev.package."*"]
# candle/mistralrs are unusably slow unoptimized — always optimize deps.
opt-level = 3
