[workspace]
members = [".", "crates/webhook-receiver", "crates/aish-webhook-client", "crates/git-discover"]
resolver = "2"

[package]
name = "aish"
version = "0.40.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2"
llama-cpp-2 = { version = "0.1", optional = true }
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
# Stream combinators (StreamExt::next) for decoding the Claude SSE token stream
# (backend streaming completions, S8.1). Already in the tree via reqwest, so
# adding it as a direct dep is essentially free.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# gzip archives for reasoning-telemetry log rotation (pure-Rust miniz_oxide
# backend — no C/zlib, already vendored transitively so this edge is free).
flate2 = "1"
tar = "0.4"
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlite-vec = "0.1.6"
tokio = { version = "1.52.3", features = ["full"] }
unicode-width = "^0.2"
urlencoding = "2.1.3"
uuid = { version = "1", features = ["v4"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tracing = "0.1"
# SPR-059 (TASK-264/265): webhook broker client — background WebSocket message
# loop that dispatches broker-delivered webhooks to plugin handlers. Keeps its
# default `net` feature (tungstenite transport) on regardless of aish's own
# `--no-default-features` CI gate, which only toggles aish's `local` feature.
aish-webhook-client = { path = "crates/aish-webhook-client" }
# git-discover: zero-dep repo detection ("what repo am I in right now?"). Gives
# aish a single typed entry point (git_discover::discover) for a checkout's
# identity + state, replacing ad-hoc `git rev-parse` shelling at call sites.
git-discover = { path = "crates/git-discover" }

[features]
default = []
# Local in-process inference via llama.cpp (GGUF models). Off by default — the
# native llama.cpp build is heavy; opt in with `cargo build --features local`.
local = ["dep:llama-cpp-2"]
cuda = ["llama-cpp-2/cuda"]

[profile.dev]
# Full DWARF debuginfo for the whole dependency graph is a major peak-memory
# contributor during compile + link (and a frequent OOM trigger alongside high
# parallelism). Line tables still give file:line in backtraces — enough for
# dev debugging — at a fraction of the memory/IO cost. See .cargo/config.toml
# for the companion jobs cap.
debug = "line-tables-only"

[profile.dev.package."*"]
# Native/ML deps (e.g. the llama.cpp bindings) are unusably slow unoptimized — always optimize deps.
opt-level = 3

[profile.release]
# A small, stripped release binary (the same binary a background coordinator job
# re-execs) without paying for a full opt-level=3 / fat-LTO compile.
opt-level = 2
lto = "thin"
strip = true
