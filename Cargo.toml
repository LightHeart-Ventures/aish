[workspace]
members = [".", "crates/webhook-receiver", "crates/aish-webhook-client"]
resolver = "2"

[package]
name = "aish"
version = "0.33.2"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2"
llama-cpp-2 = { version = "0.1", optional = true }
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
# Stream combinators (StreamExt::next) for decoding the Claude SSE token stream
# (backend streaming completions, S8.1). Already in the tree via reqwest, so
# adding it as a direct dep is essentially free.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Browser-impersonating HTTP client (wreq) for bypassing bot protection
# Used selectively for mcpmarket searches; standard reqwest for everything else
wreq = { version = "6.0.0-rc", features = ["json"] }
wreq-util = "3.0.0-rc"
rusqlite = { version = "0.32", features = ["bundled"] }
# gzip archives for reasoning-telemetry log rotation (pure-Rust miniz_oxide
# backend — no C/zlib, already vendored transitively so this edge is free).
flate2 = "1"
rustyline = "18.0.0"
tokio = { version = "1.43", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ansi_term = "0.12"
strip-ansi-escapes = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
# CLI state machine, command history
indicatif = "0.17"
duct = "0.13"
dirs = "5.0"
# Terminfo parsing
terminfo = "0.8"
termios = "0.3"
# Password prompts (GitHub token entry)
rpassword = "7.3"
# Reasoning telemetry (file logging, rotation)
tracing = "0.1"
tracing-appender = "0.2"
# MCP transport (json-rpc, stdio stream)
jsonrpc-lite = "0.6"
hex = "0.4"
indexmap = "2.0"
# Skill compilation and formatting
markdown = "1.0.0-alpha.16"
regex-syntax = "0.8"
# SVG → TEXT art
svg2polylines = "0.2"
# Cloud cost analytics (FinOps FOCUS dataset parsing)
csv = "1.3"
ipnetwork = "0.21"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
mockall = "0.12"

[features]
# Opt-in heavy reasoning feature (local llama.cpp):
# cargo build --release --features reasoning
# This bundles a 2GB+ llama-cpp binary in the release.
# For CI (GitHub Actions), we explicitly gate this OFF:
# cargo build --release --no-default-features
reasoning = ["llama-cpp-2"]
# default includes reasoning for local development (for fast reasoning);
# CI runs with --no-default-features to keep artifacts lean
default = ["reasoning"]

[[bin]]
name = "aish"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
