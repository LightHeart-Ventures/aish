#############################################################################
# preseed.cfg — unattended, bare-bones Debian (bookworm) netinst that ends up
# with aish as the default login shell.
#
# Used two ways (same file):
#   * baked into a re-mastered netinst ISO by build-netinst-iso.sh (the
#     late_command finds aish-postinstall.sh on the CD at /cdrom)
#   * served over HTTP for a PXE/netboot install (see pxe-netboot.md — the
#     late_command falls back to wget when there's no CD)
#
# This is intentionally minimal: standard system utilities only. No desktop,
# no tasksel bundles. Review the account section before using in production —
# the default credentials here are for unattended demo installs.
#############################################################################

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — DHCP, auto-pick the first interface
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string aish-os
d-i netcfg/get_domain string local
d-i netcfg/hostname string aish-os
# Don't stall the install if DHCP is slow / link is coming up.
d-i netcfg/dhcp_timeout string 60

### Mirror (the "network" in network installer — base system pulled from here)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bookworm

### Clock / time zone
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Accounts
# Root login enabled (root's shell becomes aish via the post-install hook).
d-i passwd/root-login boolean true
d-i passwd/root-password password aish
d-i passwd/root-password-again password aish
# A regular login user; the post-install hook switches this account to aish.
d-i passwd/user-fullname string aish
d-i passwd/username string aish
d-i passwd/user-password password aish
d-i passwd/user-password-again password aish
# NOTE: replace the plaintext passwords above with hashes for real use, e.g.
#   d-i passwd/user-password-crypted password [crypt(3) hash]

### Partitioning — whole disk, single partition, no LVM (bare-bones)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-lvm/confirm boolean true

### Base system
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
# Only the standard system-utilities task — no desktop, no server bundles.
tasksel tasksel/first multiselect standard
# Extra packages: aish's runtime deps + a couple of conveniences. openssh-server
# and sudo are optional — drop them for a truly airtight bare-bones box.
d-i pkgsel/include string git ca-certificates wget libgomp1 libstdc++6 sudo openssh-server
d-i pkgsel/upgrade select safe-upgrade
# Don't phone home popularity stats on an appliance.
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Finish — reboot straight into the aish system, no prompts
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/reboot boolean true

#############################################################################
### late_command — hand off to aish-postinstall.sh inside the target system.
#
# Order of preference for locating the hook script:
#   1. /cdrom/aish-postinstall.sh   (ISO-embedded install — build-netinst-iso.sh)
#   2. wget from AISH_HOOK_URL       (PXE/HTTP install — edit the URL below)
#
# `in-target` runs the script chrooted into the freshly installed system, so
# apt / chsh / /etc all operate on the real target, with working networking.
#############################################################################
d-i preseed/late_command string \
    if [ -f /cdrom/aish-postinstall.sh ]; then \
        cp /cdrom/aish-postinstall.sh /target/tmp/aish-postinstall.sh; \
    else \
        in-target sh -c 'wget -q -O /tmp/aish-postinstall.sh https://raw.githubusercontent.com/LightHeart-Ventures/aish/main/image/aish-postinstall.sh'; \
    fi; \
    in-target env AISH_VERSION=v0.27.0 AISH_USER=aish AISH_SET_ROOT=1 sh /tmp/aish-postinstall.sh
